name: Release

# Publishes to PyPI when a version tag (v2.0.0, v2.0.0rc1, ...) is pushed.
# Uses PyPI "trusted publishing": no API token is stored anywhere. One-time
# setup: a trusted publisher on PyPI (owner hoafaloaf, repository seqparse,
# workflow release.yml, environment pypi), and a "pypi" environment on GitHub
# that requires approval.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history, so we can tell whether the tag is on master.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: The tag must be on master
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/master
      - name: The tag must match the package version
        run: |
          version=$(python -c "import pathlib, re; print(re.search(r'^__version__ = \"([^\"]+)\"', pathlib.Path('seqparse/__init__.py').read_text(), re.M).group(1))")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match __version__ $version" >&2
            exit 1
          fi
      - run: python -m pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - uses: actions/upload-artifact@v5
        with:
          name: python-package-distributions
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/seqparse
    permissions:
      id-token: write # required for trusted publishing
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
