name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# CI only reads the code; the token gets no write access.
permissions:
  contents: read

# A newer push to the same branch or PR cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install ruff==0.17.6 mypy==2.4.1 -e .
      - run: ruff check seqparse benchmarks
      - run: ruff format --check seqparse benchmarks
      - run: mypy

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install ".[tests]"
      # Coverage settings live in pyproject.toml.
      - run: python -m coverage run -m pytest -q
      - run: python -m coverage report
      # Cobertura XML uses "/" in file paths on every OS, so Coveralls can
      # merge the Windows jobs with the rest.
      - run: python -m coverage xml
      - uses: coverallsapp/github-action@v2
        with:
          file: coverage.xml
          format: cobertura
          parallel: true
          flag-name: ${{ matrix.os }}-py${{ matrix.python-version }}
          # A Coveralls outage shouldn't fail the build.
          fail-on-error: false

  coverage:
    # Combines the matrix jobs' uploads into one Coveralls report.
    needs: test
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: coverallsapp/github-action@v2
        with:
          parallel-finished: true
          fail-on-error: false

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install build twine
      - run: python -m build
      # Also validates the README rendering and the license metadata.
      - run: twine check --strict dist/*
      # (grep without -q: under pipefail an early exit can fail the pipe.)
      - name: py.typed ships in the wheel and the sdist
        run: |
          python -m zipfile -l dist/*.whl | grep seqparse/py.typed >/dev/null
          tar tzf dist/*.tar.gz | grep seqparse/py.typed >/dev/null

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install ".[docs]"
      - run: sh docs/build.sh site
      - name: The site has its pages
        run: test -f site/seqparse.html && test -f site/seqparse/sequences.html
