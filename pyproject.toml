[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "seqparse"
dynamic = ["version"]
description = "A nifty way to parse your file sequences."
readme = "README.rst"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [{ name = "Geoff Harvey" }]

classifiers = [
    'Development Status :: 4 - Beta',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3 :: Only',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
    'Topic :: Software Development :: Libraries :: Python Modules',
    'Topic :: Text Processing'
]
keywords = ["command-line", "file", "sequence"]

dependencies = ["humanize"]

[project.optional-dependencies]
tests = ["coverage", "pytest"]

[project.scripts]
seqls = "seqparse.cli.seqls:run_main"

[project.urls]
Homepage = "https://github.com/hoafaloaf/seqparse"
Issues = "https://github.com/hoafaloaf/seqparse/issues"
Changelog = "https://github.com/hoafaloaf/seqparse/blob/master/CHANGES.rst"

[tool.setuptools.packages.find]
include = ["seqparse*"]
exclude = ["seqparse.test*"]

[tool.setuptools.dynamic]
version = {attr = "seqparse.__version__"}

[tool.ruff]
line-length = 80

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
# Pinned explicitly so results don't depend on the installed ruff version's
# defaults.
select = [
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "PIE",  # flake8-pie
    "PL",   # pylint
    "RUF",  # ruff-specific
    "SIM",  # flake8-simplify
    "TID",  # flake8-tidy-imports (absolute imports only)
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
]
ignore = [
    "PLC0415",  # imports inside functions avoid circular imports
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-third-party = ["humanize"]
order-by-type = false

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"seqparse/test/*" = [
    "PLR2004",  # literal values in assertions are the point of a test
]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["seqparse"]
exclude = ['^seqparse/test/']

[tool.coverage.run]
source = ["seqparse"]
omit = ["seqparse/test/*"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = [
    "@overload",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
