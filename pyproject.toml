[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "seqparse"
dynamic = ["version"]
description = "A nifty way to parse your file sequences."
readme = "README.rst"
requires-python = ">=3.11"

classifiers = [
    'Development Status :: 4 - Beta', 'License :: OSI Approved :: MIT License',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3 :: Only',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
    'Topic :: Software Development :: Libraries :: Python Modules',
    'Topic :: Text Processing'
]
keywords = ["command-line", "file", "sequence"]

dependencies = ["humanize"]

[project.optional-dependencies]
tests = ["coverage", "pylint", "pytest"]

[project.scripts]
seqls = "seqparse.cli.seqls:run_main"

[tool.setuptools.packages.find]
include = ["seqparse*"]

[tool.setuptools.dynamic]
version = {attr = "seqparse.__version__"}

[tool.ruff]
line-length = 80

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
# Pinned explicitly so results don't depend on the installed ruff version's
# defaults.
select = [
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "PIE",  # flake8-pie
    "PL",   # pylint
    "RUF",  # ruff-specific
    "SIM",  # flake8-simplify
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
]
ignore = [
    "PLC0415",  # imports inside functions avoid circular imports
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-third-party = ["humanize"]
order-by-type = false

[tool.ruff.lint.per-file-ignores]
"seqparse/test/*" = [
    "PLR2004",  # literal values in assertions are the point of a test
]
